entrypoint = 0x80000400
elf_path = "../rogue_squadron64/build/roguesquadron.elf"
rom_file_path = "../rogue_squadron64/rogue_squadron.z64"
output_func_path = "RecompiledFuncs"
use_lookup_for_all_function_calls = true

# Dual-entry functions: vanilla code enters these at an offset, but splat
# merged both entries into a single function so the skipped-entry address
# is missing from the symbol table. Re-register each as a standalone func
# so get_function() can resolve it at runtime.
manual_funcs = [
    { name = "func_8008ED70", section = ".text", vram = 0x8008ED70, size = 0x150 },
]

