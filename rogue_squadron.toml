before_vram = 0x80007A40
text = '''{ if (((uint64_t)ctx->r3 & 0xFFFFFFFFE0000000ULL) != 0xFFFFFFFF80000000ULL) { ctx->r2 = 0; goto L_80007A4C; } }'''

# Was funcs_8.c:12139 — cinematic dispatcher (func_8003E8DC). Bails to
