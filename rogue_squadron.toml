# =============================================================================
# KSEG0-guard migration (2026-05-09)
# =============================================================================
# These hooks replace the inline KSEG0 guards previously inlined into
# RecompiledFuncs/funcs_*.c. By moving them here, regens stay clean.
# Plan + tier classification at: docs/plan-kseg-guard-migration.md
# (in the RogueSquadron64Recomp repo)

# --- Tier 1: entry-bail (guard at function entry) ---

# Was: funcs_15.c:550 — defensive lookup-array guard. r4 is a struct-pointer
# that occasionally arrives non-canonical during cinematic.
[[patches.hook]]
func = "func_800646AC"
text = '''{ if (((uint64_t)ctx->r4 & 0xFFFFFFFFE0000000ULL) != 0xFFFFFFFF80000000ULL) return; }'''

# Was: funcs_4.c:27264 — defensive matrix-multiply guard. r4 + r5 are matrix
# pointers (12 floats each); $a1 sometimes arrives non-KSEG0 → high-VA AV.
[[patches.hook]]
func = "func_800191C4"
text = '''{ uint64_t a0h = (uint64_t)ctx->r4 & 0xFFFFFFFFE0000000ULL; uint64_t a1h = (uint64_t)ctx->r5 & 0xFFFFFFFFE0000000ULL; if (a0h != 0xFFFFFFFF80000000ULL || a1h != 0xFFFFFFFF80000000ULL) return; }'''

# Skip func_80090A3C — leaf of the audio-frame compute chain
# (func_8003DFA0 → func_80019868 → func_8009123C → func_80091034 → func_80090A3C).
# Trips integer divide-by-zero because MusyX (Factor 5 audio ucode) is stubbed,
# leaving sample-rate / buffer fields uninit. This is the surgical "no audio
# yet" stub: the callers don't depend on a useful return value (audio mixing
# output goes nowhere when MusyX is stubbed anyway), so returning early is
# safe. Skipping the higher-up funcs stalls cinematic progression because
# they're shared with non-audio code paths. Remove this hook once MusyX is
# recompiled (project_audio_musyx.md).
[[patches.hook]]
func = "func_80090A3C"
text = '''{ return; }'''

# rs_malloc zero-init: real N64 boot zeroes RDRAM before the game runs, so
# the original game's malloc returns zeroed pages (the heap pattern matches
# whatever was already in RAM from boot, and the game checks `==0` to mean
# "uninitialized link"). Our recompile heap holds whatever bytes happened
# to be there from previous allocations → garbage pointers in linked-list
# walks (find_manifest_entry → rs_strncpy), high-VA stores, asset crashes.
#
# Hook at rs_malloc's return-value setup (before `move v0, s2`): r18 holds
# the allocated pointer, r16 holds the original requested size. memset zero
# across that range so caller's first reads yield `==0` like the original.
[[patches.hook]]
func = "rs_malloc"
before_vram = 0x80001C74
text = '''{
    gpr addr = ctx->r18;
    gpr size = ctx->r16;
    uint32_t addr32 = (uint32_t)addr;
    uint32_t size32 = (uint32_t)size;
    if ((addr32 & 0xE0000000u) == 0x80000000u && addr32 < 0x80800000u && size32 > 0 && size32 < 0x100000u && addr32 + size32 <= 0x80800000u) {
        for (uint32_t i = 0; i < size32; ++i) MEM_B(i, addr) = 0;
    }
}'''

