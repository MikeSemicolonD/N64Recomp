[[patches.hook]]
func = "func_80006C28"
text = '''{ fprintf(stderr, "[trace] worker_spawn a0=%u a1=%u entry=0x%08X arg=0x%08X\n", (uint32_t)ctx->r4, (uint32_t)ctx->r5, (uint32_t)ctx->r6, (uint32_t)ctx->r7); fflush(stderr); }'''

