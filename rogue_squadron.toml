# func_80019BF4 = the gfx scheduler thread (creates queue 0x8011A420 and recv-loops on it).
# No static caller of this address exists in the binary — entry probe tells us whether
# it's launched via osCreateThread from somewhere we haven't traced. If this never fires
# in stderr, the scheduler is dead and that's the root cause of the GRAPH-worker stall.
[[patches.hook]]
func = "func_80019BF4"
text = '''{ fprintf(stderr, "[trace] GFX_SCHED thread ENTRY (func_80019BF4)\n"); fflush(stderr); }'''

