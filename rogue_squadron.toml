# =============================================================================
# KSEG0-guard migration (2026-05-09)
# =============================================================================
# These hooks replace the inline KSEG0 guards previously inlined into
# RecompiledFuncs/funcs_*.c. By moving them here, regens stay clean.
# Plan + tier classification at: docs/plan-kseg-guard-migration.md
# (in the RogueSquadron64Recomp repo)

# --- Diagnostic hooks for cinematic state-machine investigation ---
# All gated by ROGUESQ_LOG_HOOKS=1 — silent in normal runs. Helper is
# `rs64_dbg_log4` in src/main/upstream_compat.cpp. Re-enable when probing
# why cinematic body doesn't enter.
#
# IMPORTANT: hook body is INLINED at function entry. `return` in the hook
# returns from the WHOLE function (not just the hook block). Always wrap
# logging logic in `if (s_log) { ... }` — never use early `return`.
#
# func_8003DFA0 = cinematic OUTER loop. Entry args: $a0..$a3 vary.
# State fields gating body: B40+0x04 (state byte), B40+0x21 (flag byte),
# B50 (word, bit 5 = inner advance gate), B58 (word, bit 25 = outer gate).
#
# func_800A5D80 = cinematic INNER loop. Entry args: $a0,$a1,$a2.
# Inner body advances when $a1==2 OR bit 5 of B50.
#
# Captures first 4 entries + every 64th when env var enables logging.
[[patches.hook]]
func = "func_8003DFA0"
text = '''{
    static int s_log = -1;
    if (s_log < 0) {
        const char* e = getenv("ROGUESQ_LOG_HOOKS");
        s_log = (e && *e && *e != '0') ? 1 : 0;
    }
    if (s_log) {
        static int s_count = 0;
        ++s_count;
        if (s_count <= 4 || (s_count & 63) == 0) {
            extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
            uint32_t b04 = (uint32_t)MEM_BU(0xB44, (gpr)0xFFFFFFFF80130000ULL);
            uint32_t b21 = (uint32_t)MEM_BU(0xB61, (gpr)0xFFFFFFFF80130000ULL);
            uint32_t b50 = (uint32_t)MEM_W(0xB50, (gpr)0xFFFFFFFF80130000ULL);
            uint32_t b58 = (uint32_t)MEM_W(0xB58, (gpr)0xFFFFFFFF80130000ULL);
            rs64_dbg_log4("8003DFA0 b40+04 b40+21 B50 B58", b04, b21, b50, b58);
        }
    }
}'''

[[patches.hook]]
func = "func_800A5D80"
text = '''{
    static int s_log = -1;
    if (s_log < 0) {
        const char* e = getenv("ROGUESQ_LOG_HOOKS");
        s_log = (e && *e && *e != '0') ? 1 : 0;
    }
    if (s_log) {
        static int s_count = 0;
        ++s_count;
        if (s_count <= 4 || (s_count & 63) == 0) {
            extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
            rs64_dbg_log4("800A5D80 a0 a1 a2 count", (unsigned)ctx->r4, (unsigned)ctx->r5, (unsigned)ctx->r6, (unsigned)s_count);
        }
    }
}'''

# --- Tier 1: entry-bail (guard at function entry) ---

# Empty-pool sentinel for load_asset_with_malloc_flags. Original game's RAM
# was uninitialized garbage; `func_80097518` (audio walker) treats the
# first word of an empty pool as the -1 sentinel meaning "no entries".
# rs_malloc zero-inits, so empty audio pools at boot have first-word=0
# instead of -1, causing infinite walker loops. Stamp -1 right before
# the function returns (after r2 has been set to the malloc'd buffer).
# This is the load-bearing fix that unblocked the boot deadlock together
# with the host zmemcpy implementation in upstream_compat.cpp.
# See project_zmemcpy_root_cause.md.
[[patches.hook]]
func = "load_asset_with_malloc_flags"
before_vram = 0x80064884   # the `jr $ra` instruction
text = '''{
    static int s_force = -1;
    if (s_force < 0) {
        const char* e = getenv("ROGUESQ_DISABLE_EMPTY_POOL_SENTINEL");
        s_force = (e && *e && *e != '0') ? 0 : 1;
    }
    if (s_force) {
        uint32_t buf_ptr = (uint32_t)ctx->r2;
        if (buf_ptr >= 0x80000000u && buf_ptr < 0x80800000u) {
            int32_t* word_ptr = (int32_t*)(rdram + (buf_ptr - 0x80000000u));
            if (*word_ptr == 0) {
                *word_ptr = -1;
            }
        }
    }
}'''

# Was: funcs_15.c:550 — defensive lookup-array guard. r4 is a struct-pointer
# that occasionally arrives non-canonical during cinematic.
[[patches.hook]]
func = "func_800646AC"
text = '''{ if (((uint64_t)ctx->r4 & 0xFFFFFFFFE0000000ULL) != 0xFFFFFFFF80000000ULL) return; }'''

# Game thread per-frame loop iteration counter. The loop blocks on
# osRecvMesg(VI retrace queue) at the top of every iteration. If VI events
# aren't firing at 60Hz, the iteration rate is the actual game frame rate.
# Logs first 4 + every 64th iteration so we can see the rate.
[[patches.hook]]
func = "func_80019868"
before_vram = 0x800198E8   # L_800198E8 — top of per-frame loop
text = '''{
    static int s_count = 0;
    int n = ++s_count;
    if (n <= 4 || (n & 63) == 0) {
        extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
        rs64_dbg_log4("game_frame_iter", n, 0, 0, 0);
    }
}'''

# Skip the entire mempak menu setup (action 9, func_800C28F0). The handler
# tries to look up the "mempak" HOB which our asset loader hasn't populated
# yet, then crashes / corrupts RT64 state by emitting bad RDP commands.
# Action 9 is fire-and-forget from func_800C58A0 — caller doesn't check
# the return value. Bail at entry to keep the state machine advancing
# past mempak menu into the actual cinematic / attribution screen.
[[patches.hook]]
func = "func_800C28F0"
text = '''{ return; }'''

# Defensive guard for func_8001CB64 (struct-init helper called by mempak
# menu init in func_800C28F0). r4 = HOB-lookup result + 0x28; if the HOB
# lookup returned NULL, r4 = 0x28 (out of range) and the first MEM_W store
# crashes. The HOB lookup race is timing-dependent — log delays mask it.
# Skip the init when r4 isn't a valid KSEG0 pointer; downstream code may
# still misbehave but at least we don't AV in the struct write.
[[patches.hook]]
func = "func_8001CB64"
text = '''{ if (((uint64_t)ctx->r4 & 0xFFFFFFFFE0000000ULL) != 0xFFFFFFFF80000000ULL) return; }'''

# Same defensive guard for func_8001CB9C (next call in func_800C28F0,
# operates on the same struct returned from the HOB lookup).
[[patches.hook]]
func = "func_8001CB9C"
text = '''{ if (((uint64_t)ctx->r4 & 0xFFFFFFFFE0000000ULL) != 0xFFFFFFFF80000000ULL) return; }'''

# Was: funcs_4.c:27264 — defensive matrix-multiply guard. r4 + r5 are matrix
# pointers (12 floats each); $a1 sometimes arrives non-KSEG0 → high-VA AV.
[[patches.hook]]
func = "func_800191C4"
text = '''{ uint64_t a0h = (uint64_t)ctx->r4 & 0xFFFFFFFFE0000000ULL; uint64_t a1h = (uint64_t)ctx->r5 & 0xFFFFFFFFE0000000ULL; if (a0h != 0xFFFFFFFF80000000ULL || a1h != 0xFFFFFFFF80000000ULL) return; }'''

# Skip func_80090A3C — leaf of the audio-frame compute chain
# (func_8003DFA0 → func_80019868 → func_8009123C → func_80091034 → func_80090A3C).
# Trips integer divide-by-zero because MusyX (Factor 5 audio ucode) is stubbed,
# leaving sample-rate / buffer fields uninit. This is the surgical "no audio
# yet" stub: the callers don't depend on a useful return value (audio mixing
# output goes nowhere when MusyX is stubbed anyway), so returning early is
# safe. Skipping the higher-up funcs stalls cinematic progression because
# they're shared with non-audio code paths. Remove this hook once MusyX is
# recompiled (project_audio_musyx.md).
[[patches.hook]]
func = "func_80090A3C"
text = '''{ return; }'''

# rs_malloc zero-init: real N64 boot zeroes RDRAM before the game runs, so
# the original game's malloc returns zeroed pages (the heap pattern matches
# whatever was already in RAM from boot, and the game checks `==0` to mean
# "uninitialized link"). Our recompile heap holds whatever bytes happened
# to be there from previous allocations → garbage pointers in linked-list
# walks (find_manifest_entry → rs_strncpy), high-VA stores, asset crashes.
#
# Hook at rs_malloc's return-value setup (before `move v0, s2`): r18 holds
# the allocated pointer, r16 holds the original requested size. memset zero
# across that range so caller's first reads yield `==0` like the original.
[[patches.hook]]
func = "rs_malloc"
before_vram = 0x80001C74
text = '''{
    gpr addr = ctx->r18;
    gpr size = ctx->r16;
    uint32_t addr32 = (uint32_t)addr;
    uint32_t size32 = (uint32_t)size;
    if ((addr32 & 0xE0000000u) == 0x80000000u && addr32 < 0x80800000u && size32 > 0 && size32 < 0x100000u && addr32 + size32 <= 0x80800000u) {
        for (uint32_t i = 0; i < size32; ++i) MEM_B(i, addr) = 0;
    }
}'''

