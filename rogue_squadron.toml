# rs_free walker at 0x80001D84: bail to L_80001D94 if $a1 isn't in valid
# heap range (avoids reading garbage halfword).
[[patches.instruction]]
func = "rs_free"
vram = 0x80001D84
value = 0x00000000
[[patches.hook]]
func = "rs_free"
before_vram = 0x80001D84
text = '''{ uint32_t a1 = (uint32_t)(uint64_t)ctx->r5; if (a1 < 0x80000000u || a1 >= 0x80800000u) goto L_80001D94; ctx->r3 = MEM_HU(ctx->r5, 0x0); }'''

# func_800022F8 heap-walker at 0x80002434: same pattern; bail to L_80002474.
[[patches.instruction]]
func = "func_800022F8"
vram = 0x80002434
value = 0x00000000
[[patches.hook]]
func = "func_800022F8"
before_vram = 0x80002434
text = '''{ uint32_t v0 = (uint32_t)(uint64_t)ctx->r2; if (v0 < 0x80000000u || v0 >= 0x80800000u) goto L_80002474; ctx->r3 = MEM_HU(ctx->r2, 0x10); }'''

# --- Chain-deref guard (cutsceneDispatchSlotsByFlag) — cinematic effect dispatcher ---
# Pattern: $v0 = MEM_W($a2+0x50); $v0 = MEM_W($v0); $f2 = MEM_W($v0+0x44).
# When the loaded $v0 isn't KSEG0, treat it as null → f2 = 0 (no scaling).
# Replaces 2 instructions (the chain deref and the f2 load).
[[patches.instruction]]
func = "cutsceneDispatchSlotsByFlag"
vram = 0x800A87A0
value = 0x00000000
[[patches.instruction]]
func = "cutsceneDispatchSlotsByFlag"
vram = 0x800A87A8
value = 0x00000000
[[patches.hook]]
func = "cutsceneDispatchSlotsByFlag"
before_vram = 0x800A87A0
text = '''{ if (((uint64_t)ctx->r2 & 0xFFFFFFFFE0000000ULL) == 0xFFFFFFFF80000000ULL) { ctx->r2 = MEM_W(ctx->r2, 0x0); } else { ctx->r2 = 0; } }'''
[[patches.hook]]
func = "cutsceneDispatchSlotsByFlag"
before_vram = 0x800A87A8
text = '''{ if (((uint64_t)ctx->r2 & 0xFFFFFFFFE0000000ULL) == 0xFFFFFFFF80000000ULL) { ctx->f2.u32l = MEM_W(ctx->r2, 0x44); } else { ctx->f2.u32l = 0; } }'''

# --- Chain-deref guard (func_80047368) — struct-table walk ---
# Replaces `lhu $s4, 0x0($a1)` at 0x80047538 with conditional halfword load.
[[patches.instruction]]
func = "updateActiveGridCellState"
vram = 0x80047538
value = 0x00000000
[[patches.hook]]
func = "updateActiveGridCellState"
before_vram = 0x80047538
text = '''{ if (((uint64_t)ctx->r5 & 0xFFFFFFFFE0000000ULL) == 0xFFFFFFFF80000000ULL) { ctx->r20 = MEM_HU(ctx->r5, 0x0); } else { ctx->r20 = 0; } }'''

# --- Bail-with-full-epilogue (spawnNpcOfType) — defensive struct-init ---
# $s0 is used for ~12 stores after this point; if non-canonical, return
# early with full register restore (graceful "no-op spawn").
[[patches.hook]]
func = "spawnNpcOfType"
before_vram = 0x800400B0
text = '''{
    if (((uint64_t)ctx->r16 & 0xFFFFFFFFE0000000ULL) != 0xFFFFFFFF80000000ULL) {
        ctx->r31 = MEM_W(ctx->r29, 0x24);
        ctx->r20 = MEM_W(ctx->r29, 0x20);
        ctx->r19 = MEM_W(ctx->r29, 0x1C);
        ctx->r18 = MEM_W(ctx->r29, 0x18);
        ctx->r17 = MEM_W(ctx->r29, 0x14);
        ctx->r16 = MEM_W(ctx->r29, 0x10);
        ctx->r29 = ADD32(ctx->r29, 0x28);
        return;
    }
}'''

