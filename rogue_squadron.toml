    # is unsupported by N64Recomp. Older builds tolerated it; the rebuilt one
    # (lib/N64ModernRuntime/N64Recomp) errors out and truncates funcs.h.
    # Stub it here — a hand-written equivalent in librecomp/extensions.cpp
    # does the bzero portion that the game actually depends on.
    "func_8000040C",
    # func_80018ED4 is a broken-looking cache-flush loop (resets t0/t1 every
    # iteration → infinite loop on real hw if ever called with a1 != 16).
    # Likely dead code or splat misidentification. Stubbing is safe.
    # Has 1 'cache 0x0D' instruction at 0x80018EDC; stubbing avoids the
    # unsupported-instruction error during regen.
    "func_80018ED4",
    # zmemcpy — has cache instruction at 0x80018F4C. Stub it; the runtime
