# --- Tier 3: replace-load-with-default (NOP the lw + conditional load) ---
# Heap free-list head deref. If $v0 (head pointer) isn't KSEG0, treat as
# null (return 0) instead of dereferencing → AV. Same pattern × 3 funcs.
[[patches.instruction]]
