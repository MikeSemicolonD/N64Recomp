[[patches.hook]]
func = "func_800079F0"
before_vram = 0x80007A20
text = '''{ if (((uint64_t)ctx->r3 & 0xFFFFFFFFE0000000ULL) != 0xFFFFFFFF80000000ULL) { ctx->r2 = 0; goto L_80007A2C; } }'''

