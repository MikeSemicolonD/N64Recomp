    # NOP-the-cache patch (2026-05-09) but it caused boot hangs (something
    # was relying on bzero being a no-op). Re-stubbed for now. The original
    # comment claimed "hand-written equivalent in librecomp/extensions.cpp"
    # but no such impl exists — bzeroes are silent no-ops.
