    # stores zero memory. Stubbing meant ~290KB of BSS at 0x8010D200 was never
    # zeroed — game ran with garbage globals. Replaced with a hand-written stub
    # in librecomp/extensions.cpp instead of stubbing it as no-op.
    # "func_8000040C",
