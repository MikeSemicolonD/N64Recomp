# =============================================================================
# KSEG0-guard migration (2026-05-09)
# =============================================================================
# These hooks replace the inline KSEG0 guards previously inlined into
# RecompiledFuncs/funcs_*.c. By moving them here, regens stay clean.
# Plan + tier classification at: docs/plan-kseg-guard-migration.md
# (in the RogueSquadron64Recomp repo)

# --- Diagnostic hooks for cinematic state-machine investigation ---
# All gated by ROGUESQ_LOG_HOOKS=1 — silent in normal runs. Helper is
# `rs64_dbg_log4` in src/main/upstream_compat.cpp. Re-enable when probing
# why cinematic body doesn't enter.
#
# IMPORTANT: hook body is INLINED at function entry. `return` in the hook
# returns from the WHOLE function (not just the hook block). Always wrap
# logging logic in `if (s_log) { ... }` — never use early `return`.
#
# func_8003DFA0 = cinematic OUTER loop. Entry args: $a0..$a3 vary.
# State fields gating body: B40+0x04 (state byte), B40+0x21 (flag byte),
# B50 (word, bit 5 = inner advance gate), B58 (word, bit 25 = outer gate).
#
# func_800A5D80 = cinematic INNER loop. Entry args: $a0,$a1,$a2.
# Inner body advances when $a1==2 OR bit 5 of B50.
#
# Captures first 4 entries + every 64th when env var enables logging.
[[patches.hook]]
func = "mainGameLoop"
text = '''{
    static int s_log = -1;
    if (s_log < 0) {
        const char* e = getenv("ROGUESQ_LOG_HOOKS");
        s_log = (e && *e && *e != '0') ? 1 : 0;
    }
    if (s_log) {
        static int s_count = 0;
        ++s_count;
        if (s_count <= 4 || (s_count & 63) == 0) {
            extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
            uint32_t b04 = (uint32_t)MEM_BU(0xB44, (gpr)0xFFFFFFFF80130000ULL);
            uint32_t b21 = (uint32_t)MEM_BU(0xB61, (gpr)0xFFFFFFFF80130000ULL);
            uint32_t b50 = (uint32_t)MEM_W(0xB50, (gpr)0xFFFFFFFF80130000ULL);
            uint32_t b58 = (uint32_t)MEM_W(0xB58, (gpr)0xFFFFFFFF80130000ULL);
            rs64_dbg_log4("8003DFA0 b40+04 b40+21 B50 B58", b04, b21, b50, b58);
        }
    }
}'''

[[patches.hook]]
func = "cinematicLoopBody"
text = '''{
    // Periodic thread yield to break the iter-810 cinematic stall (OS-level
    // thread starvation — empirical: stderr writes unstick it, Sleep does
    // not). SwitchToThread yields to any ready thread on this CPU; the
    // stderr fflush call mimics the I/O-into-kernel path that's known to
    // work. ROGUESQ_DISABLE_CINE_YIELD=1 to disable for A/B testing.
    extern void rs64_cine_yield(void);
    static int s_disable = -1;
    if (s_disable < 0) {
        const char* e = getenv("ROGUESQ_DISABLE_CINE_YIELD");
        s_disable = (e && *e && *e != '0') ? 1 : 0;
    }
    if (!s_disable) rs64_cine_yield();

    static int s_log = -1;
    if (s_log < 0) {
        const char* e = getenv("ROGUESQ_LOG_HOOKS");
        s_log = (e && *e && *e != '0') ? 1 : 0;
    }
    if (s_log) {
        static int s_count = 0;
        ++s_count;
        if (s_count <= 4 || (s_count & 63) == 0) {
            extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
            rs64_dbg_log4("800A5D80 a0 a1 a2 count", (unsigned)ctx->r4, (unsigned)ctx->r5, (unsigned)ctx->r6, (unsigned)s_count);
        }
    }
}'''

# --- Tier 1: entry-bail (guard at function entry) ---

# Empty-pool sentinel for load_asset_with_malloc_flags. Original game's RAM
# was uninitialized garbage; `func_80097518` (audio walker) treats the
# first word of an empty pool as the -1 sentinel meaning "no entries".
# rs_malloc zero-inits, so empty audio pools at boot have first-word=0
# instead of -1, causing infinite walker loops. Stamp -1 right before
# the function returns (after r2 has been set to the malloc'd buffer).
# This is the load-bearing fix that unblocked the boot deadlock together
# with the host zmemcpy implementation in upstream_compat.cpp.
# See project_zmemcpy_root_cause.md.
[[patches.hook]]
func = "load_asset_with_malloc_flags"
before_vram = 0x80064884   # the `jr $ra` instruction
text = '''{
    static int s_force = -1;
    if (s_force < 0) {
        const char* e = getenv("ROGUESQ_DISABLE_EMPTY_POOL_SENTINEL");
        s_force = (e && *e && *e != '0') ? 0 : 1;
    }
    if (s_force) {
        uint32_t buf_ptr = (uint32_t)ctx->r2;
        if (buf_ptr >= 0x80000000u && buf_ptr < 0x80800000u) {
            int32_t* word_ptr = (int32_t*)(rdram + (buf_ptr - 0x80000000u));
            if (*word_ptr == 0) {
                *word_ptr = -1;
            }
        }
    }
}'''

# Was: funcs_15.c:550 — defensive lookup-array guard. r4 is a struct-pointer
# that occasionally arrives non-canonical during cinematic.
[[patches.hook]]
func = "setLookupEntryField5ByKey"
text = '''{ if (((uint64_t)ctx->r4 & 0xFFFFFFFFE0000000ULL) != 0xFFFFFFFF80000000ULL) return; }'''

# Game thread per-frame loop iteration counter. The loop blocks on
# osRecvMesg(VI retrace queue) at the top of every iteration. If VI events
# aren't firing at 60Hz, the iteration rate is the actual game frame rate.
# Logs first 4 + every 64th iteration so we can see the rate.
[[patches.hook]]
func = "viRetraceHandlerThread"
before_vram = 0x800198E8   # L_800198E8 — top of per-frame loop
text = '''{
    static int s_count = 0;
    int n = ++s_count;
    if (n <= 4 || (n & 63) == 0) {
        extern void rs64_dbg_log4(const char* tag, unsigned a, unsigned b, unsigned c, unsigned d);
        rs64_dbg_log4("game_frame_iter", n, 0, 0, 0);
    }
}'''

# RogueSquadron64Recomp: convert submitGfxFrame's per-frame osRecvMesg
# (queue D_8011A7E8) from BLOCK to NOBLOCK. The dpInterruptHandlerThread
# signals this queue when RDP completes, but the queue has size=1 and
# dpHandler's send is NOBLOCK — under our HLE flow the game's submitGfxFrame
# iter rate exceeds dpHandler's signal rate, the queue stays empty when game
# tries to recv, and game blocks forever (verified at funcs_3.c:13184 via
# the watchdog stack dump).
#
# The game discards the received msg (a1=NULL) and doesn't check the return
# value of osRecvMesg — it just uses the recv as a "wait until ready" barrier.
# Switching to NOBLOCK removes the barrier; on the host the gfx pipeline is
# always ready because gfx_thread synchronously processes send_dl.
#
# Three osRecvMesg(D_8011A7E8, BLOCK) call sites — patch each delay-slot's
# `addiu $a2, $zero, 0x1` to `addiu $a2, $zero, 0x0` (encoding 0x24060000).
[[patches.instruction]]
func = "submitGfxFrame"
vram = 0x8000C4AC
value = 0x24060000

[[patches.instruction]]
func = "submitGfxFrame"
vram = 0x8000C2BC
value = 0x24060000

[[patches.instruction]]
func = "bufferArbiterProducerScanWait"
vram = 0x8000BFCC
value = 0x24060000

# Fourth osRecvMesg blocker found via watchdog after first three patches —
# different queue (D_8011A818), still in submitGfxFrame. Same NOBLOCK fix.
[[patches.instruction]]
func = "submitGfxFrame"
vram = 0x8000C0B8
value = 0x24060000

# Fifth blocker: func_8001C260 polling loop at 0x8001C29C waits for flag at
# 0x8011A8C8 to clear. The clearer (func_8001C2F8) is invoked from func_8001818C,
# which under HLE isn't reached (or its work was already done by gfx_thread).
#
# Patch the function's entry-check `lbu $v0, 0x0($v1)` at 0x8001C278 to
# `addiu $v0, $zero, 0` (encoding 0x24020000) so $v0 is always 0 → the
# subsequent beq jumps to L_8001C2E0 (function exit) immediately, skipping the
# wait. Caller proceeds without the operation-complete sync.
[[patches.instruction]]
func = "waitForPostSwapAck"
vram = 0x8001C278
value = 0x24020000

# Sixth blocker (found at iter 1160 — ~30 from natural transition):
# func_8000BF60 has a SECOND blocking recv at 0x8000BF94 on queue D_8011A818.
[[patches.instruction]]
func = "bufferArbiterProducerScanWait"
vram = 0x8000BF98
value = 0x24060000

# Eighth blocker: func_800668B0 has a busy-wait loop at L_800668C0 that
# spins on func_8008E57C until it returns non-zero. func_8008E57C iterates
# entries [0..N) calling func_800920FC(i) which checks
# `MEM_BU(ptr_at_0x801487F8 + i*0x88, 0) != 0`. Under HLE with stubbed audio,
# no entry ever becomes valid → infinite spin.
[[patches.instruction]]
func = "waitForAnyAudioSlot"
vram = 0x800668CC
value = 0x00000000

# Ninth blocker (found at iter 1152 — POST-cinematic-transition, inside the
# menu): menuOverlayInit has the SAME busy-wait pattern. Same fix — NOP the
# beq that loops back to func_8008E57C call.
[[patches.instruction]]
func = "menuOverlayInit"
vram = 0x800C593C
value = 0x00000000

# Tenth blocker: waitOnVideoQueue has yet another osRecvMesg(BLOCK) at
# 0x8001BEA0. NOBLOCK conversion.
[[patches.instruction]]
func = "waitOnVideoQueue"
vram = 0x8001BEA4
value = 0x24060000

# Eleventh blocker investigation (REVERTED — see project memory):
# bufferArbiterProducerMark starts with osRecvMesg(D_80128D10, BLOCK).
# Patching to NOBLOCK didn't help (iter still bounded at ~1176) and risks
# breaking the slot-state-machine semantics (the wait probably gates which
# state to transition). The right fix is host-side state-machine modeling,
# not more instruction patches.

# Seventh blocker (heapWalker infinite loop at L_80007A78). The walk follows
# r3 = *r3 until finding a node whose first word is 0. Under corruption the
# list can be cyclic. Use cycle detection: remember the initial r3 and bail
# if we revisit it (with a per-call reset via the function entry hook).
[[patches.instruction]]
func = "heapWalker"
vram = 0x80007A78
value = 0x00000000

[[patches.hook]]
func = "heapWalker"
text = '''{
    // Reset cycle-detection state at function entry. Needs to be a global so
