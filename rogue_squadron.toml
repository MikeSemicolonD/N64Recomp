# func_80018D80 (matrix-transform helper) has 4 'cache 0x0D' instructions at
# 0x80018D88-0x80018D94 that flush 4 cachelines before doing FP math. On the
# recompile we don't emulate caches, so the flushes are no-ops in spirit.
# Replace each with NOP so N64Recomp can recompile the rest of the function
# (which is real FP work we don't want to lose by stubbing the whole thing).
# Additionally, the function uses the MIPS PIC return pattern
# (`addu $t9, $ra, $zero` at 0x80018D84 + `jr $t9` at 0x80018E58) which
# N64Recomp emits as LOOKUP_FUNC(ctx->r25) — failing because r25 holds the
# caller's ra not a MIPS function address. Replace `jr $t9` with `jr $ra`
# (0x03E00008) so the recompile treats it as a normal function exit.
[[patches.instruction]]
func = "func_80018D80"
vram = 0x80018D88
value = 0x00000000

[[patches.instruction]]
func = "func_80018D80"
vram = 0x80018D8C
value = 0x00000000

[[patches.instruction]]
func = "func_80018D80"
vram = 0x80018D90
value = 0x00000000

[[patches.instruction]]
func = "func_80018D80"
vram = 0x80018D94
value = 0x00000000

# Patch `jr $t9` (0x03200008) -> `jr $ra` (0x03E00008) at 0x80018E58.
# t9 was set to ra at function entry; both encodings have identical
# effect, but only `jr $ra` is recognized by N64Recomp as a function exit.
[[patches.instruction]]
func = "func_80018D80"
vram = 0x80018E58
value = 0x03E00008

