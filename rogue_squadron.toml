# Patch the gate's `beq $v1, $zero, L_8001C3DC` (0x8001C3C4) to NOP. The
# fall-through now always reaches the `osSendMesg` to D_8011A7E8, unblocking
# the game thread once per DP-event. The delay-slot at 0x8001C3C8 is a benign
# `addu $a1, $zero, $zero` (zeros a1 = msg arg) which is what the fall-through
# path expects anyway.
[[patches.instruction]]
