# event (queue D_8011A408 from osSetEventMesg(OS_EVENT_DP)), then checks flag
# byte at 0x8011A89D — only forwards to the game queue if the flag is non-zero.
# In our setup that flag never becomes 1 on the first iteration, so the game
# thread blocks forever (verified via the iter-191 freeze watchdog dump at
# funcs_3.c:13184 → funcs_27.c:7269 → funcs_8.c:10612).
